<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#202020" />
  <title>ဘုရားဖူးကြမယ် · Myanmar Vibe</title>
  <meta name="description" content="ရွှေတိဂုံဘုရားကို သင့်စားပွဲပေါ်မှာ တင်ပြီး မွေးနေ့ထောင့်မှာ ရေကပ်လှူ ဆီမီးပူဇော် ပန်းကပ်လှူ ခေါင်းလောင်းထိုး ဘုရားဖူးပါ။" />
  <link rel="canonical" href="https://pocket-myanmar.vercel.app/pagoda.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Myanmar Vibe" />
  <meta property="og:title" content="ဘုရားဖူးကြမယ် · Myanmar Vibe" />
  <meta property="og:description" content="ရွှေတိဂုံဘုရားကို သင့်စားပွဲပေါ်မှာ တင်ပြီး မွေးနေ့ထောင့်မှာ ဘုရားဖူးပါ။ Shwedagon Pagoda in AR on your table." />
  <meta property="og:url" content="https://pocket-myanmar.vercel.app/pagoda.html" />
  <meta property="og:image" content="https://pocket-myanmar.vercel.app/og-pagoda.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ဘုရားဖူးကြမယ် · Myanmar Vibe" />
  <meta name="twitter:image" content="https://pocket-myanmar.vercel.app/og-pagoda.png" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" />
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="pagoda.css" />
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
  </script>
</head>
<body>
  <main class="app pagoda" id="app">
    <header class="topbar">
      <a class="icon-btn back-btn" href="index.html" title="သနပ်ခါး" aria-label="သနပ်ခါးသို့ ပြန်သွားမယ်">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 5 8 12l7 7"/></svg>
      </a>
      <div class="brand">
        <img class="brand-logo" src="flag.svg" alt="" width="30" height="30" />
        <span class="brand-en">Myanmar Vibe</span>
      </div>
    </header>

    <section class="stage" id="stage">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="gl" role="img" aria-label="သင့်စားပွဲပေါ်က ရွှေတိဂုံဘုရား"></canvas>

      <div class="chips" id="chips" hidden>
        <span class="chip" id="chipMerit"></span>
        <span class="chip" id="chipTime"></span>
      </div>

      <button class="sound-btn" id="btnSound" type="button" aria-pressed="true" aria-label="နောက်ခံအသံ ပိတ်မယ်"></button>

      <div class="hint" id="hint" role="status" aria-live="polite" hidden></div>
      <div class="sadhu" id="sadhu" aria-live="assertive" hidden>
        <span>သာဓု သာဓု သာဓု</span>
        <small id="sadhuSub"></small>
      </div>

      <div class="intro" id="intro">
        <div class="intro-card">
          <h1>ဘုရားဖူးကြမယ်</h1>
          <div class="hero" aria-hidden="true"><img src="icons/pagoda-hero.webp" alt="" decoding="async" /></div>
          <p class="lead">ရွှေတိဂုံ နောက်ခံနဲ့ သင့်မွေးနေ့ ထောင့်ကို စားပွဲပေါ်မှာ တင်ပြီး ရေကပ်လှူ၊ ဆီမီးပူဇော်၊ ပန်းကပ်လှူ၊ ခေါင်းလောင်းထိုးပါ။</p>
          <p class="pick-label" id="pickLabel">မွေးနေ့ ရွေးပါ</p>
          <div class="days" id="days" role="radiogroup" aria-labelledby="pickLabel"></div>
          <button id="btnStart" class="btn primary" disabled>စမယ်</button>
          <div class="loadbar" id="loadbar" role="progressbar" aria-label="ဘုရား ပြင်ဆင်နေပါတယ်" hidden><i></i></div>
        </div>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

      <div class="shutter-row">
        <button id="btnShutter" class="shutter" aria-label="ဓာတ်ပုံရိုက်မယ်" disabled><span></span></button>
      </div>
    </section>

    <section class="panel" id="panel">
      <div class="offers" role="group" aria-label="ပူဇော်ရန်">
        <button class="offer" id="offBless" disabled><span class="ic" aria-hidden="true"><img src="icons/bless.webp" alt="" width="40" height="40" /></span><span class="mm">ရေသပ္ပါယ်မည်</span></button>
        <button class="offer" id="offWater" disabled><span class="ic" aria-hidden="true"><img src="icons/water.webp" alt="" width="40" height="40" /></span><span class="mm">ရေကပ်လှူမည်</span></button>
        <button class="offer" id="offLamp" disabled><span class="ic" aria-hidden="true"><img src="icons/lamp.webp" alt="" width="40" height="40" /></span><span class="mm">ဆီမီးပူဇော်မည်</span></button>
        <button class="offer" id="offFlower" disabled><span class="ic" aria-hidden="true"><img src="icons/flower.webp" alt="" width="40" height="40" /></span><span class="mm">ပန်းကပ်လှူမည်</span></button>
        <button class="offer" id="offBell" disabled><span class="ic" aria-hidden="true"><img src="icons/bell.webp" alt="" width="40" height="40" /></span><span class="mm">ခေါင်းလောင်းထိုးမည်</span></button>
      </div>
      <div class="row controls tools">
        <button class="pill" id="btnReplace" disabled>နေရာပြန်ချ</button>
        <button class="pill" id="btnDay" disabled>နေ့နံပြောင်းမည်</button>
        <label class="strength">
          <span>အရွယ်</span>
          <input id="size" type="range" min="0.04" max="0.3" step="0.005" value="0.12" aria-label="ဘုရားအရွယ်အစား" />
        </label>
      </div>
    </section>
  </main>

  <div class="sheet" id="result" role="dialog" aria-modal="true" aria-label="ရိုက်ထားသောဓာတ်ပုံ" hidden>
    <div class="sheet-card">
      <img id="resultImg" alt="ဘုရားဖူးပြီး ရိုက်ထားတဲ့ ဓာတ်ပုံ" />
      <div class="sheet-actions">
        <button id="btnShare" class="btn primary">မျှဝေမယ်</button>
        <a id="btnSave" class="btn ghost" download="myanmar-vibe-pagoda.jpg">သိမ်းမယ်</a>
        <button id="btnBack" class="btn ghost">နောက်သို့</button>
      </div>
    </div>
  </div>

  <script type="module" src="pagoda.js"></script>
</body>
</html>
