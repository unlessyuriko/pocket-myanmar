<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Pocket Myanmar">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dc95"/>
      <stop offset="1" stop-color="#d9a841"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#6a1a32"/>
      <stop offset="1" stop-color="#1c0610"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#bg)"/>

  <!-- pagoda peeking out of the pocket -->
  <g fill="url(#gold)">
    <path d="M60 10 L62 20 H58 Z"/>
    <rect x="54.5" y="20" width="11" height="2.6" rx="1.3"/>
    <rect x="52.5" y="24.4" width="15" height="2.8" rx="1.4"/>
    <path d="M56.5 29 L63.5 29 L66.5 47 L53.5 47 Z"/>
    <path d="M47 70 C47 56 53 51 55.5 45 H64.5 C67 51 73 56 73 70 Z"/>
  </g>

  <!-- pocket -->
  <path d="M20 66 H100 V90 A16 16 0 0 1 84 106 H36 A16 16 0 0 1 20 90 Z" fill="url(#gold)"/>
  <path d="M26 72 H94" stroke="#1b1410" stroke-opacity=".28" stroke-width="1.6" stroke-dasharray="4 3" stroke-linecap="round"/>

  <!-- thanakha (bodhi) leaf on the pocket -->
  <path d="M60 100 C58 96 52 92 50 86 C47 80 50 75 55 75 C58 75 60 77 60 79 C60 77 62 75 65 75 C70 75 73 80 70 86 C68 92 62 96 60 100 Z" fill="#1b1410" fill-opacity=".82"/>
  <path d="M60 80 V96 M60 85 L54.5 81.5 M60 85 L65.5 81.5 M60 90 L56 87 M60 90 L64 87" stroke="#f1d283" stroke-width="1.4" stroke-linecap="round" fill="none"/>
</svg>
