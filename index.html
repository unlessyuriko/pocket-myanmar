<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d3228" />
  <title>Myanmar Vibe</title>
  <meta name="description" content="သင့်မျက်နှာပေါ်မှာ မြန်မာ့သနပ်ခါး လိမ်းကြည့်ပါ။ ပုံစံအမျိုးမျိုး ရွေးနိုင်ပါတယ်။" />
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="logo.svg" alt="" width="30" height="30" />
        <span class="brand-en">Myanmar Vibe</span>
        <span class="brand-mm">သနပ်ခါး</span>
      </div>
      <button id="btnSwitch" class="icon-btn" title="ပြန်ရွေးမယ်" aria-label="ပြန်ရွေးမယ်" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M4 7h3l2-2h6l2 2h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Zm8 3a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/></svg>
      </button>
    </header>

    <section class="stage" id="stage">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="view" role="img" aria-label="သနပ်ခါးလိမ်းထားသော သင့်မျက်နှာ"></canvas>
      <canvas id="fx" aria-hidden="true"></canvas>

      <div class="intro" id="intro">
        <div class="intro-card">
          <img class="intro-logo" src="logo.svg" alt="Myanmar Vibe" width="120" height="120" />
          <h1>သနပ်ခါး လိမ်းကြမယ်</h1>
          <p>အိမ်မှာတုန်းကလို သနပ်ခါးလိမ်းကြည့်ပါ။ ပုံစံရွေးပြီး ဆယ်ဖီရိုက်ကာ မိသားစုဆီ ပို့လိုက်ပါ။</p>
          <button id="btnCamera" class="btn primary">ကင်မရာဖွင့်မယ်</button>
          <label class="btn ghost">
            ဓာတ်ပုံရွေးမယ်
            <input id="filePhoto" type="file" accept="image/*" hidden />
          </label>
          <p class="fine">သင့်ဖုန်းထဲမှာပဲ အလုပ်လုပ်ပါတယ်။ ဘာမှ ပြင်ပကို မပို့ပါဘူး။</p>
        </div>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

      <div class="shutter-row">
        <button id="btnShutter" class="shutter" aria-label="ဓာတ်ပုံရိုက်မယ်" disabled><span></span></button>
        <button id="btnRec" class="rec-btn" title="ဗီဒီယိုရိုက်မယ်" aria-label="ဗီဒီယိုရိုက်မယ် (၅ စက္ကန့်)" hidden>
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="3" y="6" width="12" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 10.5 21 7.5v9l-6-3Z" fill="currentColor"/></svg>
        </button>
        <button id="btnFlip" class="flip-btn" title="ကင်မရာပြောင်းမယ်" aria-label="ကင်မရာပြောင်းမယ်" hidden>
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 7h-3.5l-1.5-2h-6L7.5 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1ZM9 13a3 3 0 0 1 5.2-2M15 13a3 3 0 0 1-5.2 2M14.5 9.5v1.8h-1.8M9.5 16.5v-1.8h1.8"/></svg>
        </button>
      </div>
    </section>

    <section class="panel" id="panel">
      <div class="row shapes" id="shapes" role="radiogroup" aria-label="သနပ်ခါးပုံစံ"></div>

      <div class="row controls">
        <div class="group" role="group" aria-label="ထပ်လိမ်းရန်">
          <button class="pill" data-extra="forehead" aria-pressed="false">နဖူး</button>
          <button class="pill" data-extra="nose" aria-pressed="false">နှာခေါင်း</button>
          <button class="pill" data-extra="chin" aria-pressed="false">မေးစေ့</button>
        </div>
      </div>

      <div class="row controls">
        <div class="group tones" id="tones" role="radiogroup" aria-label="အရောင်"></div>
        <label class="strength">
          <span>ထူထပ်မှု</span>
          <input id="strength" type="range" min="0.3" max="1" step="0.05" value="0.85" />
        </label>
      </div>
    </section>
  </main>

  <div class="sheet" id="result" role="dialog" aria-modal="true" aria-label="ရိုက်ထားသောဓာတ်ပုံ" hidden>
    <div class="sheet-card">
      <img id="resultImg" alt="သင့်သနပ်ခါးဆယ်ဖီ" />
      <video id="resultVideo" aria-label="သင့်သနပ်ခါးဗီဒီယို" playsinline muted loop controls hidden></video>
      <div class="sheet-actions">
        <button id="btnShare" class="btn primary">မျှဝေမယ်</button>
        <a id="btnSave" class="btn ghost" download="myanmar-vibe-thanakha.jpg">သိမ်းမယ်</a>
        <button id="btnBack" class="btn ghost">နောက်သို့</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
